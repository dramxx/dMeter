[package]
name = "dmeter"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["dMeter Contributors"]
description = "A fast, beautiful terminal system monitor built with Rust"
license = "MIT"
repository = "https://github.com/dramxx/dMeter"
keywords = ["system-monitor", "tui", "performance", "monitoring"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
sysinfo = "0.38"
toml = "1"
dirs = "7"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.13"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Performance"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
